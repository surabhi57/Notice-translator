services:
  - type: web
    name: notice-translator-1
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: none
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: notiq-postgres
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
databases:
  - name: notiq-postgres
    plan: free
    databaseName: notiq
    user: notiq
